# references:
# * http://www.objc.io/issue-6/travis-ci.html
# * https://github.com/supermarin/xcpretty#usage

osx_image: xcode14.2
language: objective-c
before_install:
- pod repo add noke-inc https://github.com/noke-inc/Specs.git || true
- pod install --project-directory=Example
script:
- set -o pipefail && xcodebuild test -enableCodeCoverage YES -workspace Example/NokeMobileLibrary.xcworkspace -scheme NokeMobileLibrary-Example -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14' ONLY_ACTIVE_ARCH=NO | xcpretty
- pod lib lint --sources='https://github.com/noke-inc/Specs.git,https://cdn.cocoapods.org/' --allow-warnings
